<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#000}
  .b{position:relative;width:1600px;height:400px;overflow:hidden;color:#fff;font-family:'Instrument Sans',system-ui,sans-serif;
    background:radial-gradient(900px 420px at 50% -10%,rgba(79,216,200,.18),transparent 60%),radial-gradient(700px 360px at 88% 100%,rgba(217,228,168,.10),transparent 60%),#000}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(1000px 500px at 50% 40%,#000 55%,transparent 100%)}
  .c{position:relative;z-index:2;padding:52px 72px;display:flex;flex-direction:column;justify-content:space-between;height:100%;box-sizing:border-box}
  .top{display:flex;align-items:center;justify-content:space-between}
  .wm{display:flex;align-items:center;gap:14px}
  .wm img{width:56px;height:56px}
  .wm b{display:block;font-size:32px;letter-spacing:-.03em;line-height:1}
  .wm span{display:block;margin-top:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
  .sx{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .sx small{font-family:'Pixelify Sans',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .sx img{height:26px}
  .pix{font-family:'Pixelify Sans',monospace;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#4fd8c8}
  h1{margin:6px 0 0;font-family:'Instrument Serif',serif;font-weight:400;font-size:88px;line-height:.98;letter-spacing:-.02em}
  h1 i{color:#d9e4a8}
  p{margin:10px 0 0;font-size:22px;color:rgba(255,255,255,.8)}
  .m{position:absolute;z-index:1}
</style></head><body>
<div class="b">
  <div class="grid"></div>
  <img class="m" src="../slides/assets/chars/group-white.png" style="right:-40px;bottom:-120px;width:560px">
  <div class="c">
    <div class="top">
      <div class="wm"><img src="../slides/assets/icon.svg"><div><b>Yale AI</b><span>An Undergraduate Organization</span></div></div>
      <div class="sx"><small>Kickoff powered by</small><img src="../slides/assets/spacexai-white.png"></div>
    </div>
    <div>
      <div class="pix">Kickoff competition · YaleAI × SpaceXAI</div>
      <h1>Rapid-fire <i>Cursor.</i></h1>
      <p>How quickly can you build an app for Yale students? Three winners, three months of Cursor each.</p>
    </div>
  </div>
</div>
</body></html>
