<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Afore Fireside Email Banner</title>
<!-- The email header for the Afore fireside: the Luma cover (afore-vc-scout/luma-banner)
     redrawn as a 2:1 strip. Same blue stage, volt headline, pixel dot field, speaker pill
     and tilted Lightning Pitches card. Render with ./render.sh. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  :root { --blue: #0271fe; --blue-deep: #0052c9; --navy: #001632; --volt: #d9fe00; --white: #ffffff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 600px; background: var(--blue); overflow: hidden; }
  body { font-family: "Instrument Sans", system-ui, sans-serif; color: var(--white); -webkit-font-smoothing: antialiased; }

  .canvas {
    position: relative; width: 1200px; height: 600px; overflow: hidden;
    background:
      radial-gradient(800px 560px at 100% 0%, #2b8bff 0%, rgba(43,139,255,0) 60%),
      radial-gradient(700px 600px at 0% 100%, var(--blue-deep) 0%, rgba(0,82,201,0) 65%),
      var(--blue);
  }
  .canvas::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.16) 1.4px, transparent 1.6px);
    background-size: 24px 24px; background-position: 12px 12px;
    -webkit-mask-image: radial-gradient(620px 480px at 86% 72%, #000 0%, transparent 72%);
            mask-image: radial-gradient(620px 480px at 86% 72%, #000 0%, transparent 72%);
  }
  .inner { position: absolute; inset: 56px 64px; }

  .yai { display: flex; align-items: center; gap: 12px; }
  .yai svg { width: 46px; height: 46px; display: block; }
  .yai span { font-weight: 700; font-size: 33px; letter-spacing: -0.03em; line-height: 1; }

  h1 { margin-top: 38px; font-weight: 700; font-size: 74px; line-height: .92; color: var(--volt); letter-spacing: -0.05em; }
  .afore-row { display: flex; align-items: center; gap: 14px; margin-top: 2px; height: 191px; }
  .afore-hero { display: block; width: 360px; height: auto; }
  .q { font-weight: 700; font-size: 191px; line-height: 1; letter-spacing: -0.04em; color: var(--volt); position: relative; top: 3px; }

  .speaker { position: absolute; left: 0; bottom: 0; display: inline-flex; align-items: center; gap: 18px;
    padding: 10px 34px 10px 10px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.28);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 18px 40px -18px rgba(0,22,50,.45); }
  .speaker img { width: 78px; height: 78px; border-radius: 50%; object-fit: cover; display: block;
    box-shadow: 0 0 0 4px var(--volt), 0 14px 30px -10px rgba(0,22,50,.5); }
  .speaker b { display: block; font-weight: 700; font-size: 31px; letter-spacing: -0.03em; line-height: 1.05; }
  .speaker span { display: block; margin-top: 5px; font-weight: 600; font-size: 21px; letter-spacing: -0.01em; color: rgba(255,255,255,.94); }

  .where { position: absolute; right: 0; bottom: 8px; text-align: right; line-height: 1; }
  .where b { display: block; font-weight: 700; font-size: 40px; letter-spacing: -0.03em; }
  .where span { display: block; margin-top: 10px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: var(--volt); }

  .timer {
    position: absolute; right: 6px; top: 6px; width: 330px;
    background: var(--volt); color: var(--navy); border-radius: 30px;
    padding: 24px 28px; box-shadow: 0 34px 70px -22px rgba(0,22,50,.55);
    transform: rotate(-3deg);
  }
  .timer .label { display: flex; justify-content: space-between; align-items: center;
    font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; }
  .timer .label .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 0 5px rgba(255,59,48,.2); }
  .timer .title { margin-top: 12px; font-weight: 700; font-size: 48px; line-height: .95; letter-spacing: -0.045em; }
  .timer .clock { font-family: "Pixelify Sans", monospace; font-weight: 700; font-size: 100px; line-height: .9; letter-spacing: -0.02em; margin-top: 14px; }
  .timer .bar { margin-top: 14px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
  .timer .bar b { height: 11px; background: var(--navy); }
  .timer .cap { margin-top: 14px; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; line-height: 1.12; }
</style>
</head>
<body>
<div class="canvas">
  <div class="inner">
    <div class="yai">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#d9e4a8" fill-rule="evenodd" d="m12 1c-7.710 0-11 3.29-11 11s3.29 11 11 11 11-3.29 11-11-3.29-11-11-11zm1 13.407v2.593c0 .553-.447 1-1 1s-1-.447-1-1v-2.593c-.855-.911-3.182-3.697-3.496-7.320-.048-.551.359-1.035.909-1.083.554-.055 1.035.359 1.083.909.214 2.465 1.632 4.537 2.504 5.599.872-1.062 2.290-3.134 2.504-5.599.048-.55.524-.956 1.083-.909.55.048.957.532.909 1.083-.315 3.624-2.642 6.409-3.496 7.320z"/>
      </svg>
      <span>YaleAI Association</span>
    </div>

    <h1>Want to meet with</h1>
    <div class="afore-row"><img class="afore-hero" src="afore-logo-hd.png" alt="Afore Capital"><span class="q">?</span></div>

    <div class="speaker">
      <img src="nathan-yu.jpg" alt="Nathan Yu">
      <div><b>Nathan Yu</b><span>Principal Investor @ Afore Capital</span></div>
    </div>

    <div class="where"><b>Tsai CITY · 4:30 to 6:30 PM</b><span>Yale students only</span></div>

    <div class="timer">
      <div class="label"><span>Live · 10-15 slots</span><span class="dot"></span></div>
      <div class="title">+ Lightning<br>Pitches</div>
      <div class="clock">3:00</div>
      <div class="bar"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
      <div class="cap">Pitch Afore Capital<br>in three minutes.</div>
    </div>
  </div>
</div>
</body>
</html>
